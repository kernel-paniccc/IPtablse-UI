name: CI
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  naming:
    if: github.event.deleted != true && github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check branch and commit names
        shell: bash
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          types='(feat|fix|docs|refactor|test|build|ci|chore|style|perf|revert)'
          branch_pattern="^${types}/[a-z0-9]+(-[a-z0-9]+)*$"
          commit_pattern="^${types}(\([a-z0-9]+(-[a-z0-9]+)*\))?!?: [^[:space:]].*$"
          case "$BRANCH" in
            main|ui|ui_rep_K) ;;
            *) [[ "$BRANCH" =~ $branch_pattern ]] || { echo "Invalid branch name"; exit 1; } ;;
          esac
          # Commits already integrated before this policy are grandfathered.
          prior=447d60bb11c82998a607dcc1206b8d0a2a9435c0
          if [[ "$BASE" =~ ^0+$ ]]; then BASE="origin/$DEFAULT_BRANCH"; fi
          exclude=("^$BASE")
          if git cat-file -e "$prior^{commit}" 2>/dev/null; then exclude+=("^$prior"); fi
          commits=$(git rev-list --no-merges HEAD "${exclude[@]}")
          for sha in $commits; do
            subject=$(git show -s --format=%s "$sha")
            [[ "$subject" =~ $commit_pattern ]] || { echo "Invalid commit title at $sha"; exit 1; }
          done
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Qt
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Build
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci --parallel 2
      - name: Check application startup
        run: |
          QT_QPA_PLATFORM=offscreen ./build-ci/iptables-ui &
          pid=$!
          sleep 3
          kill -TERM "$pid"
          status=0
          wait "$pid" || status=$?
          test "$status" -eq 143

  rollback:
    needs: [naming, build]
    if: >-
      failure() && github.event_name == 'push' &&
      !github.event.created && !github.event.forced &&
      (needs.naming.result == 'failure' || needs.build.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Restore the tree from before the failed push
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH_REF: ${{ github.ref }}
        run: |
          set -eu
          remote=$(git ls-remote --exit-code origin "$BRANCH_REF")
          if [[ "${remote%%[[:space:]]*}" != "$AFTER" ]]; then
            echo "Branch advanced since this run. Skipping rollback."
            exit 0
          fi
          git merge-base --is-ancestor "$BEFORE" "$AFTER"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rollback=$(git commit-tree "$BEFORE^{tree}" -p "$AFTER" -m "revert: restore tree before failed push $AFTER")
          git push --force-with-lease="$BRANCH_REF:$AFTER" origin "$rollback:$BRANCH_REF"
